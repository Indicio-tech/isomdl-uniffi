name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-checks:
    name: Lint and Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python linting tools
        run: |
          pip install ruff

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Make gradlew executable
        run: chmod +x kotlin/gradlew

      - name: Check Rust formatting
        run: |
          cd rust
          cargo fmt -- --check

      - name: Check Python formatting
        run: |
          ruff format --check python/tests/

      - name: Run Python linting
        run: |
          ruff check python/tests/

      - name: Check Kotlin formatting (detekt)
        run: |
          cd kotlin
          ./gradlew detekt --no-daemon || echo "Detekt not configured, skipping..."

      - name: Run Clippy (without building)
        run: |
          cd rust
          cargo clippy -- -D warnings

  rust-build-and-test:
    name: Rust Build and Test
    runs-on: ubuntu-latest
    needs: lint-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust crate
        run: |
          cd rust
          cargo build --release

      - name: Run Rust tests
        run: |
          cd rust
          cargo test

  build-bindings:
    name: Build Python Bindings
    runs-on: ${{ matrix.os }}
    needs: [lint-checks, rust-build-and-test]
    # Build bindings once per platform, then test against multiple Python versions
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Use one Python version for building

      - name: Install maturin
        run: pip install maturin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Python bindings with maturin (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: |
          echo "🔍 Building for Linux with maturin..."
          echo "🔍 Python version: $(python3 --version)"
          echo "🔍 Rust version: $(rustc --version)"
          maturin build --release --interpreter python3.12

      - name: Build Python bindings with maturin (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: python
        run: |
          echo "🔍 Building for macOS with maturin..."
          echo "🔍 Python version: $(python3 --version)"
          echo "🔍 Rust version: $(rustc --version)"
          maturin build --release --interpreter python3.12

      - name: Install built wheel for testing
        working-directory: python
        run: |
          pip install --force-reinstall target/wheels/*.whl

      - name: Debug built artifacts
        working-directory: python
        run: |
          echo "🔍 Checking built artifacts..."
          ls -la target/wheels/
          echo "🔍 Installed package:"
          python -c "import isomdl_uniffi; print('✅ Successfully imported isomdl_uniffi')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: python-wheel-${{ matrix.os }}
          path: python/target/wheels/*.whl
          retention-days: 7

  test-python:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-bindings
    # Test the pre-built bindings against multiple Python versions
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/

      - name: Install wheel and test dependencies
        run: |
          pip install dist/*.whl
          pip install pytest pytest-cov cryptography

      - name: Debug installed package
        run: |
          echo "🔍 Installed packages:"
          pip list | grep isomdl || echo "isomdl not found!"
          echo "🔍 Testing import..."
          python -c "import isomdl_uniffi; print('✅ Successfully imported isomdl_uniffi')"

      - name: Run Python tests
        working-directory: python
        run: |
          echo "🔍 Running tests with Python ${{ matrix.python-version }}..."
          pytest tests/ -v --tb=short

  cross-language-tests:
    name: Cross-Language Tests
    runs-on: ubuntu-latest
    needs: build-bindings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-ubuntu-latest
          path: dist/

      - name: Install wheel and Python dependencies
        run: |
          pip install dist/*.whl
          pip install pytest pytest-cov cryptography

      - name: Install TypeScript dependencies
        run: |
          cd typescript
          npm ci

      - name: Generate Python Artifacts
        working-directory: python
        run: |
          # The wheel is already installed, just run the script
          python tests/generate_cross_language_artifacts.py

      - name: Run TypeScript Tests
        run: |
          cd typescript
          npm test

      - name: Run Python Verification Tests
        working-directory: python
        run: |
          pytest tests/test_cross_language_verification.py -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-build-and-test, kotlin-build-and-test, build-bindings, test-python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-ubuntu-latest
          path: dist/

      - name: Install wheel and dependencies
        run: |
          pip install dist/*.whl
          pip install pytest pytest-cov cryptography

      - name: Debug installed package
        run: |
          echo "🔍 Testing import..."
          python -c "import isomdl_uniffi; print('✅ Successfully imported isomdl_uniffi')"

      - name: Run comprehensive Python test suite
        working-directory: python
        run: |
          # Run comprehensive Python test suite
          pytest tests/ -v --tb=short

      - name: Verify selective disclosure tests
        working-directory: python
        run: |
          # Run specific selective disclosure tests
          pytest tests/test_selective_disclosure.py -v --tb=short

  kotlin-build-and-test:
    name: Kotlin Build and Test
    runs-on: ubuntu-latest
    needs: rust-build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk: 28.2.13676358

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            kotlin/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Make gradlew executable
        run: chmod +x kotlin/gradlew

      - name: Compile Kotlin JVM target
        run: |
          cd kotlin
          ./gradlew compileKotlinJvm --no-daemon --stacktrace

      - name: Build Android debug sources
        run: |
          cd kotlin
          ./gradlew compileDebugSources --no-daemon --stacktrace

      - name: Build Android test sources
        run: |
          cd kotlin
          ./gradlew compileDebugAndroidTestSources --no-daemon --stacktrace

      - name: Build JVM jar
        run: |
          cd kotlin
          ./gradlew jvmJar --no-daemon --stacktrace

      - name: Compile Kotlin metadata for all platforms
        run: |
          cd kotlin
          ./gradlew compileKotlinMetadata --no-daemon --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kotlin-test-results
          path: |
            kotlin/build/reports/tests/
            kotlin/build/test-results/
          retention-days: 7

      - name: Upload build artifacts on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: kotlin-build-failure-logs
          path: |
            kotlin/build/
            kotlin/.gradle/
          retention-days: 3

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit (with caching)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: |
          cd rust
          cargo audit \
            --ignore RUSTSEC-2022-0040 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370
