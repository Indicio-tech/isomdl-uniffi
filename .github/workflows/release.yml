name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get-version.outputs.version }}
          body: |
            ## isomdl-uniffi Release ${{ steps.get-version.outputs.version }}

            This release includes:
            - 🦀 Rust library for ISO 18013-5 mDL implementation
            - 🐍 Python bindings via UniFFI
            - 🔒 Comprehensive selective disclosure tests
            - ✅ Full test suite validation

            ### Changes
            Please see the commit history for detailed changes in this release.

            ### Installation

            #### Python Bindings
            Download the appropriate wheel file for your platform and install:
            ```bash
            pip install https://github.com/Indicio-tech/isomdl-uniffi/releases/download/v${{ steps.get-version.outputs.version }}/isomdl_uniffi-${{ steps.get-version.outputs.version }}-<platform>.whl
            ```

            Or browse available wheels below and install the one matching your platform:
            - **Linux (x86_64)**: `*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl`
            - **macOS (Intel/Apple Silicon)**: `*-macosx_11_0_arm64.macosx_11_0_x86_64.macosx_11_0_universal2.whl`
            - **Windows (x86_64)**: `*-win_amd64.whl`

            #### Rust Crate
            ```toml
            [dependencies]
            isomdl-uniffi = "${{ steps.get-version.outputs.version }}"
            ```
          draft: false
          prerelease: false

  build-python-wheels:
    name: Build Python Wheels (${{ matrix.platform.os }})
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: "linux", runner: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", manylinux: "2_17" }
          - { os: "macos-intel", runner: "macos-15-intel", target: "x86_64-apple-darwin" }
          - { os: "macos-arm", runner: "macos-latest", target: "aarch64-apple-darwin" }
          - { os: "windows", runner: "windows-latest", target: "x86_64-pc-windows-msvc" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wheels (Linux/Windows)
        if: matrix.platform.os == 'linux' || matrix.platform.os == 'windows'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.9 python3.10 python3.11 python3.12
          sccache: 'true'
          manylinux: ${{ matrix.platform.os == 'linux' && format('auto', matrix.platform.manylinux) || 'auto' }}
          working-directory: python

      - name: Build wheels (macOS)
        if: matrix.platform.os == 'macos-intel' || matrix.platform.os == 'macos-arm'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.9 python3.10 python3.11 python3.12
          sccache: 'true'
          working-directory: python

      - name: List built wheels
        shell: bash
        run: |
          echo "🔍 Built wheels:"
          ls -lh python/dist/

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  upload-wheels-to-release:
    name: Upload Wheels to GitHub Release
    needs: [create-release, build-python-wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List all wheels
        run: |
          echo "📦 All built wheels:"
          ls -lh dist/

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
